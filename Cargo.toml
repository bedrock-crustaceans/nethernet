[workspace]
resolver = "3"
members = ["bevy-nethernet", "nethernet", "nethernet-tokio"]

[workspace.dependencies]
nethernet = { path = "./nethernet" }
http = "1"
thiserror = "2"
bytes = "1.12.1"
tracing = "0.1.44"
aes = "0.9.3"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.10.3"
rsa = { version = "0.9.10",  features = ["sha2"] }
tokio = { version = "1.53.1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3.34"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls-pemfile = "2"
rtc = "0.20"
ring = "0.17"
byteorder = "1"
